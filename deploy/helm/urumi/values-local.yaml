wordpress:
  # k3d exposes Traefik on this host port; WordPress must include it in canonical URLs.
  wordpressHost: store.urumi.local:8081
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: store.urumi.local
    path: /
    pathType: Prefix
    tls: false
  customPostInitScripts:
    configure-local-url.sh: |
      #!/bin/bash
      set -euo pipefail
      chmod u+w /bitnami/wordpress/wp-config.php
      wp config delete WP_HOME --type=constant --allow-root
      wp config delete WP_SITEURL --type=constant --allow-root
      wp option update home 'http://store.urumi.local:8081' --allow-root
      wp option update siteurl 'http://store.urumi.local:8081' --allow-root
      chmod u-w /bitnami/wordpress/wp-config.php

dashboard:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: dashboard.urumi.local
    path: /
    pathType: Prefix
    tls: false

# Persist the working Gemini chat configuration through Helm upgrades.
# The API key remains in the pre-created Kubernetes Secret, never in values.
chat:
  enabled: true
  providerBaseUrl: https://generativelanguage.googleapis.com/v1beta/openai/
  model: gemini-3.5-flash-lite
  existingSecret: urumi-chat-provider
  timeoutMs: 30000
  maxIterations: 6
gateway:
  ingress:
    enabled: true
    className: traefik
    host: gateway.urumi.local
    path: /mcp