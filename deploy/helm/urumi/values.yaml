# Shared defaults. Environment-specific network settings belong in values-local.yaml.
wordpress:
  existingSecret: urumi-store-credentials
  wordpressUsername: admin
  wordpressEmail: admin@example.invalid
  wordpressFirstName: Urumi
  wordpressLastName: Administrator
  wordpressBlogName: Urumi Store
  wordpressScheme: http
  wordpressPlugins: none
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
  livenessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  customPostInitScripts:
    install-woocommerce.sh: |
      #!/bin/bash
      set -euo pipefail
      wp plugin install woocommerce --activate --allow-root
  # Keep the storefront on its existing HTTP ingress, while enabling TLS only
  # for the in-cluster MCP-to-WordPress connection.
  extraVolumes:
    - name: internal-tls
      secret:
        secretName: urumi-store-wordpress-internal-tls
  extraVolumeMounts:
    - name: internal-tls
      mountPath: /certs
      readOnly: true
  mariadb:
    architecture: standalone
    auth:
      database: bitnami_wordpress
      username: bn_wordpress
      existingSecret: urumi-store-credentials
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      livenessProbe:
        enabled: true
      readinessProbe:
        enabled: true


woocommerceMcp:
  enabled: true
  replicaCount: 1
  image:
    repository: urumi-woocommerce-mcp
    tag: m2-tlsfix-r2
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  wooCommerce:
    baseUrl: https://urumi-store-wordpress.urumi.svc.cluster.local
    requestTimeoutMs: 10000
    tls:
      secretName: urumi-store-wordpress-internal-tls
  existingSecret: urumi-woocommerce-mcp-credentials
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

internalMcpUpstreams:
  inventory:
    enabled: true
    replicaCount: 1
    image:
      repository: urumi-inventory-mcp
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 3001
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  support:
    enabled: true
    replicaCount: 1
    image:
      repository: urumi-support-mcp
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 3002
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
