# Shared defaults. Environment-specific network settings belong in values-local.yaml.
wordpress:
  existingSecret: urumi-store-credentials
  wordpressUsername: admin
  wordpressEmail: admin@example.invalid
  wordpressFirstName: Urumi
  wordpressLastName: Administrator
  wordpressBlogName: Urumi Store
  wordpressScheme: http
  wordpressPlugins: none
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
  livenessProbe:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  customPostInitScripts:
    install-woocommerce.sh: |
      #!/bin/bash
      set -euo pipefail
      wp plugin install woocommerce --activate --allow-root
  mariadb:
    architecture: standalone
    auth:
      database: bitnami_wordpress
      username: bn_wordpress
      existingSecret: urumi-store-credentials
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      livenessProbe:
        enabled: true
      readinessProbe:
        enabled: true
