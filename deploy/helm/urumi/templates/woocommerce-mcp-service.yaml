apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-woocommerce-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.woocommerceMcp.service.type }}
  selector:
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.woocommerceMcp.service.port }}
      targetPort: http
      protocol: TCP