{{- range $name, $upstream := .Values.internalMcpUpstreams }}
{{- if $upstream.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-mcp
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}-mcp
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: {{ $upstream.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-mcp
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-mcp
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}-mcp
          image: "{{ $upstream.image.repository }}:{{ $upstream.image.tag }}"
          imagePullPolicy: {{ $upstream.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $upstream.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $upstream.service.port | quote }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $upstream.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-mcp
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}-mcp
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}-mcp
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $upstream.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
