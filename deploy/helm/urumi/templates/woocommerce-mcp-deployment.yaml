apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-woocommerce-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.woocommerceMcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: woocommerce-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woocommerce-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"
          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: WOOCOMMERCE_BASE_URL
              value: {{ .Values.woocommerceMcp.wooCommerce.baseUrl | quote }}
            - name: WOOCOMMERCE_REQUEST_TIMEOUT_MS
              value: {{ .Values.woocommerceMcp.wooCommerce.requestTimeoutMs | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/urumi-wordpress/ca.crt
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceMcp.existingSecret }}
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceMcp.existingSecret }}
                  key: WOOCOMMERCE_CONSUMER_SECRET
          volumeMounts:
            - name: wordpress-internal-ca
              mountPath: /etc/ssl/urumi-wordpress
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
      volumes:
        - name: wordpress-internal-ca
          secret:
            secretName: {{ .Values.woocommerceMcp.wooCommerce.tls.secretName }}
            items:
              - key: ca.crt
                path: ca.crt
