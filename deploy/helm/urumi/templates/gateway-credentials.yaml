{{- $name := .Values.gateway.existingSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $postgresPassword := randAlphaNum 32 -}}
{{- if $existing }}{{- $postgresPassword = (index $existing.data "postgres-password" | b64dec) -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: urumi
    app.kubernetes.io/component: gateway
type: Opaque
data:
  postgres-password: {{ if $existing }}{{ index $existing.data "postgres-password" }}{{ else }}{{ $postgresPassword | b64enc }}{{ end }}
  database-url: {{ if $existing }}{{ index $existing.data "database-url" }}{{ else }}{{ printf "postgresql://%s:%s@%s-postgres:%v/%s" .Values.postgres.username $postgresPassword .Release.Name .Values.postgres.service.port .Values.postgres.database | b64enc }}{{ end }}
  upstream-credential-encryption-key: {{ if $existing }}{{ index $existing.data "upstream-credential-encryption-key" }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
