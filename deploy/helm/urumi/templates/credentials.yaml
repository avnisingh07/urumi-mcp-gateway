{{- $name := include "urumi.credentialsName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: urumi
    app.kubernetes.io/component: store
type: Opaque
data:
  wordpress-password: {{ if $existing }}{{ index $existing.data "wordpress-password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  mariadb-root-password: {{ if $existing }}{{ index $existing.data "mariadb-root-password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  mariadb-password: {{ if $existing }}{{ index $existing.data "mariadb-password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
